source-file ~/.config/tmux/tmux.reset.conf

# PATH 설정 (popup/run-shell·TPM 에서 도구를 찾을 수 있도록)
#
# 닭·달걀 주의: 예전에는 이 줄이 `run-shell 'tmux set-environment ...'` 였는데,
# GUI 앱(Ghostty 등)이 tmux 를 직접 띄우면 서버가 최소 PATH(/usr/bin:/bin:...)를
# 물려받아 run-shell 안에서 `tmux` 자체를 찾지 못했다. PATH 를 고치려면 tmux 가
# 필요하고 tmux 를 찾으려면 PATH 가 필요한 구조여서 항상 127 로 실패했고,
# 그 결과 TPM 까지 실패해 플러그인 전부가 로드되지 않았다.
#
# 해결: tmux 바이너리를 PATH 에 의존하지 않고 찾는다. macOS(homebrew arm64/x86)와
# Linux(/usr/bin) 을 모두 커버한다.
run-shell 'for b in "$(command -v tmux 2>/dev/null)" /opt/homebrew/bin/tmux /usr/local/bin/tmux /usr/bin/tmux; do \
  [ -n "$b" ] && [ -x "$b" ] && exec "$b" set-environment -g PATH \
    "$HOME/.fzf/bin:$HOME/.local/bin:$HOME/.local/share/gem/ruby/3.0.0/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"; \
done'

# tmux 안쪽 TERM.
#
# 예전에는 아래쪽에 set -g default-terminal "${TERM}" 가 있어서 Ghostty 의
# xterm-ghostty 가 그대로 tmux 안으로 들어갔다. 그러면 tmux 안에서 ssh 할 때
# TERM=xterm-ghostty 가 원격으로 전파되고, 원격에 그 terminfo 가 없어서
#   tput: unknown terminal "xterm-ghostty"
# 가 쏟아지고 zsh 라인편집(zle)이 깨져 입력한 글자가 두 번 보이는 증상이 났다.
#
# tmux-256color 가 정석이지만 오래된 원격에는 없을 수 있어 확인 후 고른다.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set-option -g default-terminal "tmux-256color"' \
  'set-option -g default-terminal "screen-256color"'

# 트루컬러 — 바깥 터미널 종류별로 RGB 를 알려준다
set-option -ga terminal-overrides ',xterm-256color:RGB'
set-option -ga terminal-overrides ',xterm-ghostty:RGB'
set-option -ga terminal-overrides ',tmux-256color:RGB'

# macOS 타이틀바(= Ghostty 창 상단)에 표시할 내용.
#
# Ghostty 는 타이틀바에 위젯을 추가하는 기능이 없다. 거기 나오는 글자는
# 안에서 도는 프로그램이 이스케이프 시퀀스로 정해주는 "터미널 창 제목"이고,
# 그 프로그램이 tmux 다. 즉 상단바 정보를 늘리려면 여기를 고쳐야 한다.
# (Ghostty 쪽 window-subtitle = working-directory 가 부제로 한 줄 더 붙는다)
set -g set-titles on
set -g set-titles-string "#{session_name} · #{window_index}:#{window_name} · #{s|^$HOME|~|:pane_current_path}#{?window_zoomed_flag, ⚡,}"

set -g mouse on
set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g prefix ^B

set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
# status-position 은 theme.conf 가 정한다 (이 파일보다 나중에 source 되어
# 어차피 덮어쓴다). 여기 중복으로 두면 고쳐도 안 먹는 것처럼 보인다.
# default-terminal 은 위쪽에서 terminfo 존재 여부를 보고 정한다.
# 여기서 "${TERM}" 로 덮으면 xterm-ghostty 가 원격까지 전파돼 ssh 가 깨진다.
setw -g mode-keys vi

# ============================================================================
# 외형 (색·상태바·팝업) — 헥사값은 전부 theme.conf 에만 있다
# ============================================================================
source-file ~/.config/tmux/theme.conf

# ============================================================================
# TPM 플러그인
# ============================================================================
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_selection_mouse 'clipboard'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-floax'

set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

set -g @continuum-restore 'off'
set -g @resurrect-strategy-nvim 'session'

# ============================================================================
# 키바인딩 (화려 스타일 popup)
# ============================================================================
# 팝업 외형(색·제목)은 theme.conf 의 @popup_* / @fzf_colors 를 참조한다.
#
# [주의] display-popup 의 "명령 인자"에서는 #{...} 가 확장되지 않는다.
# run-shell 은 확장하기 때문에 같을 거라 착각하기 쉬운데 다르다.
# 그래서 팝업 안에서 도는 명령은 전부 스크립트로 빼고, 색은 스크립트가
# `tmux show -gv @fzf_colors` 로 직접 읽는다.
# -s / -S 스타일 인자도 확장되지 않아 전부 뺐다. 팝업 색은 theme.conf 의
# popup-style / popup-border-style / popup-border-lines 전역 옵션이 담당한다.
# 제목(-T)만 예외적으로 확장된다(화면 캡처로 확인) — 팝업별 색 구분은 제목으로.

# SSH 호스트 선택
bind g display-popup -E -w 50% -h 60% -T '#{@popup_title_ssh}' \
  "/bin/bash $HOME/.config/tmux/scripts/ssh-select.sh"

# 세션 선택
bind s display-popup -E -w 50% -h 50% -T '#{@popup_title_sess}' \
  "/bin/bash $HOME/.config/tmux/scripts/session-select.sh"

bind S command-prompt -p "New session:" "new-session -s '%%'"
bind x if-shell "[ #{window_panes} -eq 1 ]" "kill-window" "kill-pane"

# tmuxinator 워크스페이스 선택
bind w display-popup -E -w 50% -h 50% -T '#{@popup_title_work}' \
  "/bin/bash $HOME/.config/tmux/scripts/tmuxinator-select.sh"

bind f new-window -n "yazi" "yazi"

# ── 왼쪽 사이드바 (cmux 의 세로 탭에 해당) ──────────────────────────────────
# 세션 목록이 아니라 "윈도우" 목록이다. tmux pane 은 한 세션 안에 살기 때문에
# 세션을 바꾸면 사이드바도 사라진다 — 세션 사이드바는 구조적으로 불가능하다.
#
# 윈도우마다 pane 을 하나씩 붙이므로 창을 옮겨도 같은 자리에 같은 모습이라
# 하나의 고정 사이드바처럼 보인다.
set -g @sidebar_width 22
bind B run-shell "$HOME/.config/tmux/scripts/sidebar-toggle.sh toggle"

# 새로 만든 창에도 자동으로 붙인다 (사이드바가 켜져 있을 때만)
# 훅은 대상 창을 인자로 넘겨야 한다 — run-shell 안에서 조회하면 "새 창"이 아니라
# 클라이언트가 보고 있는 창이 잡힌다.
set-hook -g after-new-window "run-shell \"$HOME/.config/tmux/scripts/sidebar-toggle.sh hook '#{session_name}:#{window_index}'\""

# 사이드바를 클릭하면 그 윈도우로 전환. 그 외 pane 은 tmux 기본 동작 유지.
#
# 좌표(#{mouse_y}) 대신 #{mouse_line}(마우스 아래 줄의 텍스트)을 쓴다.
# 줄 내용에서 창 번호를 뽑으므로 상태줄 높이나 pane 위치가 바뀌어도 안 깨진다.
bind -n MouseDown1Pane if-shell -F '#{==:#{pane_title},sidebar}' \
  "run-shell \"$HOME/.config/tmux/scripts/sidebar-click.sh '#{mouse_line}'\"" \
  "select-pane -t = ; send-keys -M"

# 세션 빠른 전환 — prefix 없이 Option+1 / Option+2
# WezTerm 은 Ctrl+1/2 + background_child_process 로 했지만 Ghostty 에는 외부 명령
# 실행 액션이 없다. Ctrl+숫자는 터미널이 고유 코드를 보내지 않아 tmux 가 못 받으므로
# Alt(=macOS Option, macos-option-as-alt=true)로 옮겼다. 터미널 종류와 무관하게 동작.
bind -n M-1 run-shell "$HOME/.config/tmux/scripts/session-switch.sh main"
bind -n M-2 run-shell "$HOME/.config/tmux/scripts/session-switch.sh servers"

run '~/.tmux/plugins/tpm/tpm'

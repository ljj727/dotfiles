# First remove *all* keybindings
# unbind-key -a
# Now reinsert all the regular tmux keys
bind ^X lock-server
bind ^C new-window -c "$HOME"
bind ^D detach
bind * list-clients

bind H previous-window
bind L next-window

bind r command-prompt "rename-window %%"
# 설정 리로드 — 실제 파일은 ~/.tmux.conf 다.
# 예전에는 ~/.config/tmux/tmux.conf 를 가리켜 조용히 실패했고 중복 정의였다.
bind R source-file ~/.tmux.conf \; display-message "tmux.conf 리로드됨"
bind ^B last-window
bind ^W list-windows
bind z resize-pane -Z
bind ^L refresh-client
bind l refresh-client
bind | split-window
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind '"' choose-window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix - resize-pane -D 7
bind -r -T prefix = resize-pane -U 7

# Pane 균등 분배
bind e select-layout even-horizontal    # 수평 균등
bind E select-layout even-vertical      # 수직 균등
bind t select-layout tiled              # 타일 (격자)
bind : command-prompt
bind * setw synchronize-panes
bind P set pane-border-status
bind x swap-pane -D
bind S choose-session
bind K send-keys "clear"\; send-keys "Enter"
bind Escape copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe "command -v pbcopy >/dev/null && pbcopy || command -v clip.exe >/dev/null && clip.exe || command -v wl-copy >/dev/null && wl-copy || xclip -selection clipboard"

# 휠 스크롤 속도 — tmux 기본은 휠 이벤트 하나에 5줄이라 너무 빨랐다 (2026-08-26).
# `set -g mouse on` 이면 휠을 tmux 가 가로채므로 여기서 줄여야 한다. 1 이 최소값.
#
# 체감 속도 = (Ghostty 가 보내는 휠 이벤트 수) × (여기 -N 값).
# 이미 1 이므로 더 느리게 하려면 ghostty/config 의 mouse-scroll-multiplier 를
# 낮춘다 — 트랙패드는 precision, 휠 마우스는 discrete 쪽이다.
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# ── 페이지 스크롤 진입 (2026-08-31) ──────────────────────────────────────────
# tmux 는 스크롤하려면 먼저 copy-mode 로 들어가야 한다. 이 두 바인딩이
# "copy-mode 진입 + 한 페이지 이동" 을 한 번에 한다.
# 이미 copy-mode 면 copy-mode 를 다시 불러도 무해하다.
#
# Ghostty 가 ctrl+- / ctrl+= 를 각각 prefix+_ / prefix++ 로 바꿔 보낸다.
# ctrl+- 같은 조합은 표준 제어문자가 없어 터미널마다 인코딩이 달라서,
# 직접 받지 않고 prefix 시퀀스로 넘기는 편이 확실하다.
# (copy-mode 안에서는 PgUp/PgDn·C-f/C-b·C-u/C-d 가 이미 동작한다)
bind _ copy-mode \; send-keys -X page-down
bind + copy-mode \; send-keys -X page-up

# Allow Ctrl-f to pass through to shell (forward-char)
unbind C-f

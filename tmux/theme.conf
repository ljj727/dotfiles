# ============================================================================
# tmux 외형 — 색·상태바·팝업
#
# 색 값(헥사)은 이 파일에만 있다. 테마를 바꾸려면 아래 팔레트만 고치면 된다.
# .tmux.conf 에는 헥사값이 하나도 없다.
#
# 참고: status-style·pane-border-style 같은 -style 옵션은 tmux 문서상 포맷
#       확장(#{...})이 보장되지 않는다. 그래서 이 파일 안에서는 헥사를 직접 쓰고,
#       포맷 확장이 문서화된 status-left/right·window-status-format 에서만
#       @c_* 변수를 쓴다.
# ============================================================================

# ── 팔레트 (Dracula) ────────────────────────────────────────────────────────
# 포맷 문자열에서 #{@c_이름} 으로 참조한다.
set -g @c_bg      "#282a36"
set -g @c_fg      "#f8f8f2"
set -g @c_surface "#44475a"
set -g @c_muted   "#6272a4"
set -g @c_cyan    "#8be9fd"
set -g @c_green   "#50fa7b"
set -g @c_orange  "#ffb86c"
set -g @c_pink    "#ff79c6"
set -g @c_purple  "#bd93f9"
set -g @c_red     "#ff5555"
set -g @c_yellow  "#f1fa8c"

# ── pane 테두리 = 창 안쪽 프레임 ────────────────────────────────────────────
# Ghostty 에는 창 테두리 옵션이 없다(+show-config --default 로 확인). 그래서
# "테두리"는 tmux 의 pane 경계선으로 만든다.
#
# pane-border-status 를 켜면 pane 이 하나뿐일 때도 경계선을 그린다
# (pane_height 가 20→19 로 줄어드는 것으로 확인). 그래서 분할하지 않아도
# 창 아래쪽에 항상 선 한 줄이 생겨 프레임처럼 보인다.
#   lines:      single / double / heavy / simple / number  (rounded 는 없음)
#   indicators: off / colour / arrows / both — 활성 pane 방향을 화살표로도 표시
set -g pane-border-lines heavy
set -g pane-border-indicators both
set -g pane-active-border-style 'fg=#bd93f9,bg=default'
set -g pane-border-style 'fg=#44475a,bg=default'

# ── 하단바(pane 경계선 정보줄)는 끈다 ──────────────────────────────────────
# 2026-08-24: pane-border-status bottom 으로 만들었던 하단 정보줄(pane 번호·
# 명령·크기 + sys-info.sh 의 CPU·배터리·네트워크)을 사용자 요청("조잡해")으로
# 제거. sys-info.sh 는 남겨둔다 — 되살리려면 theme.conf.bak-paneborder 참고.
set -g pane-border-status off

# ── 상태바 기본 ─────────────────────────────────────────────────────────────
# 2026-08-24: 상단 상태바도 제거 (사용자 요청 — herdr 로 이행, herdr 가 자체
# 탭바·사이드바를 그리므로 tmux 장식은 전부 끈다). 아래 status-left/right·
# window-status-* 정의는 되살릴 때를 위해 남겨둔다 — status off 면 평가되지 않는다.
set -g status off
set -g status-interval 5
set -g status-justify left
set -g status-position top
set -g status-style 'bg=#282a36,fg=#f8f8f2'

# ── 왼쪽: 세션 이름 + 현재 경로 + prefix/copy 모드 표시 ─────────────────────
# prefix 를 누른 상태와 copy-mode 를 색으로 구분한다. 지금 어떤 모드인지
# 몰라서 키가 안 먹는 것처럼 느껴지는 상황을 없애준다.
#
# 경로: $HOME 은 tmux 가 설정 파일을 읽을 때 확장하므로 s|| 치환으로 ~ 로 줄인다.
#       #{=-28:...} 는 뒤에서 28글자만 남긴다(앞을 자름). 깊은 경로에서 정작
#       중요한 마지막 디렉토리가 잘리지 않게 하려는 것.
set -g status-left-length 100
set -g status-left "\
#{?client_prefix,#[fg=#{@c_bg}#,bg=#{@c_orange}#,bold] PREFIX ,\
#{?pane_in_mode,#[fg=#{@c_bg}#,bg=#{@c_cyan}#,bold] COPY ,\
#[fg=#{@c_green}#,bold] ● }}\
#[fg=#{@c_purple},bg=#{@c_bg},bold] #S \
#[fg=#{@c_muted},nobold]󰉋 #[fg=#{@c_cyan}]#{=-28:#{s|^$HOME|~|:pane_current_path}} \
#[fg=#{@c_surface}]│ "

# ── 윈도우 탭 아이콘 ────────────────────────────────────────────────────────
# 창에서 돌고 있는 명령(#{pane_current_command})에 따라 아이콘을 붙인다.
# #{m:패턴,값} 은 glob 매칭이라 python3.12 / claude.exe 처럼 접미사가 붙어도 잡힌다.
#
# 셸 호출(#())이 아니라 순수 포맷이라 fork 가 없다. 창 개수만큼 매번 돌아도
# 비용이 0 이다. 대신 조건이 중첩돼 길어지는데, 그래서 옵션 하나로 빼두고
# 아래 두 포맷에서 #{E:@win_icon} 으로 재확장한다(동작 확인함).
set -g @win_icon "\
#{?#{mi:python*,#{pane_current_command}},󰌠,\
#{?#{m:*vim,#{pane_current_command}},󰏫,\
#{?#{m:claude*,#{pane_current_command}},󰚩,\
#{?#{m:ssh*,#{pane_current_command}},󰣀,\
#{?#{m:*git*,#{pane_current_command}},󰊢,\
#{?#{m:node*,#{pane_current_command}},󰎙,\
#{?#{m:docker*,#{pane_current_command}},󰡨,\
#{?#{m:yazi,#{pane_current_command}},󰝰,\
#{?#{m:*top,#{pane_current_command}},󰄨,\
#{?#{m:man,#{pane_current_command}},󰂽,\
#{?#{m:less,#{pane_current_command}},󰂽,\
#{?#{m:*sh,#{pane_current_command}},󰆍,\
󰒓}}}}}}}}}}}}"

# 사이드바(prefix+B)가 켜져 있으면 창 목록을 상단에서 숨긴다 — 같은 정보가
# 왼쪽에 세로로 나오므로 중복이다. @sidebar 는 sidebar-toggle.sh 가 세션 옵션으로
# 써두는 값이고, 포맷 안에서 #{@sidebar} 로 읽을 수 있다(확인함).
#
# 벨(!)만은 사이드바 상태와 무관하게 남긴다 — 놓치면 안 되는 신호라서.
#
# [함정 두 개]
#  1) window-status-separator 는 포맷 확장이 안 된다. 조건부로 못 만들어서
#     빈 값으로 두고, 탭 양쪽 공백으로 구분한다.
#  2) #{?...} 안에서 #[fg=...,bold] 의 쉼표가 분기 구분자로 먹힌다.
#     스타일 안의 쉼표는 #, 로 이스케이프해야 한다.
set -g window-status-separator ""
set -g window-status-format "\
#{?#{==:#{@sidebar},1},#{?window_bell_flag,#[fg=#{@c_red}] ! ,},\
#[fg=#{@c_muted}] #{E:@win_icon} #I·#W#{?window_last_flag,⁺,}#{?window_bell_flag,#[fg=#{@c_red}]!,} }"
set -g window-status-current-format "\
#{?#{==:#{@sidebar},1},,\
#[fg=#{@c_pink}#,bold] #{E:@win_icon} #I·#W#{?window_zoomed_flag,#[fg=#{@c_yellow}] ⚡,} }"

# ── 오른쪽: git · 원격 호스트 · 창 개수 · 시각 ──────────────────────────────
# 시스템 정보(CPU·배터리·네트워크)는 아래쪽 pane 경계선으로 뺐다. 여기는
# "지금 뭘 하고 있나"에 관한 것만 남긴다.
#
# #() 는 status-interval(5초)마다 실행되므로 스크립트가 빨라야 한다.
# git-info.sh 는 저장소가 아니면 아무것도 출력하지 않는다(측정 18ms).
#
# 원격 표시: tmux 포맷은 환경변수를 읽지 못한다(#{SSH_CONNECTION} 은 항상 빈 값).
# 그래서 #() 셸 호출로 판단한다. #() 는 상태바를 실제로 다시 그릴 때만 돌아서
# display -p 로는 빈 값이 나온다 — 검증할 때 착각하기 쉬운 지점이다.
set -g status-right-length 140
set -g status-right "\
#[fg=#{@c_green}]#($HOME/.config/tmux/scripts/git-info.sh '#{pane_current_path}') \
#[fg=#{@c_orange}]#(test -n \"$SSH_CONNECTION\" && printf '\\uf0c1 %s ' \"$(hostname -s)\")\
#[fg=#{@c_surface}]│ #[fg=#{@c_muted}]󰖯 #{session_windows} \
#[fg=#{@c_surface}]│ #[fg=#{@c_cyan}]󰃰 %a %d %b \
#[fg=#{@c_surface}]│ #[fg=#{@c_yellow},bold]%H:%M "

# ── 팝업 외형 ───────────────────────────────────────────────────────────────
# [중요] display-popup 의 -s / -S 스타일 인자는 #{...} 를 확장하지 않는다.
# 실제 화면을 캡처해 확인했다: -s 'bg=#ff0000' 은 빨강이 나오지만
# -s '#{@test_bg}' 는 아무 색도 안 나온다. 예전에 bind 쪽에서 @popup_* 를
# 인자로 넘기던 방식은 그래서 조용히 무시되고 있었다.
#
# 대신 tmux 3.4+ 의 전역 옵션으로 지정한다. 여기서 설정하면 모든 팝업에
# 적용되고 bind 쪽은 색을 몰라도 된다(= .tmux.conf 에 헥사가 없다).
set -g popup-style        'bg=#282a36,fg=#f8f8f2'
set -g popup-border-style 'fg=#bd93f9,bg=#282a36'
set -g popup-border-lines rounded

# 제목(-T)은 확장된다(화면 캡처로 확인). 그래서 팝업별 색 구분은 제목으로 한다.
set -g @popup_title_ssh  "#[fg=#282a36,bg=#8be9fd,bold] 󰣀  SSH Hosts "
set -g @popup_title_sess "#[fg=#282a36,bg=#bd93f9,bold] 󰓩  Sessions "
set -g @popup_title_work "#[fg=#282a36,bg=#ff79c6,bold] 󰏘  Workspaces "
set -g @fzf_colors "fg:#f8f8f2,bg:#282a36,hl:#bd93f9,fg+:#ffffff,bg+:#44475a,hl+:#ff79c6,info:#ffb86c,prompt:#50fa7b,pointer:#ff79c6,marker:#50fa7b,header:#6272a4"

# ── 메시지·모드 ─────────────────────────────────────────────────────────────
set -g message-style 'fg=#282a36,bg=#f1fa8c,bold'
set -g message-command-style 'fg=#f8f8f2,bg=#44475a'
set -g mode-style 'fg=#282a36,bg=#bd93f9'
set -g display-panes-active-colour '#bd93f9'
set -g display-panes-colour '#44475a'
set -g clock-mode-colour '#bd93f9'

[mgr]
# 분할 비율: [부모, 현재, 프리뷰]
ratio = [1, 1, 4]

# 파일 정렬
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true

# 표시 설정
show_hidden = false
show_symlink = true

[preview]
# 이미지 프리뷰 최대 크기
max_width = 1000
max_height = 1000

# 탭 너비
tab_size = 2

# 이미지 어댑터 (Ghostty kitty graphics + tmux allow-passthrough)
image_filter = "triangle"
image_quality = 75
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

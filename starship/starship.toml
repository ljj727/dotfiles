# Starship 프롬프트 설정 — 컴팩트 2줄 구성 (2026-09-22 전면 재작성)
#
# 설계 원칙
#   1. 2줄. 1줄에 맥락(경로·git), 2줄에 입력만. 경로가 길어도 명령이 안 밀린다.
#   2. 쓰는 모듈만 format 에 적는다. 안 적은 모듈은 렌더링되지 않으므로
#      모듈별 disabled = true 를 늘어놓을 필요가 없다.
#   3. right_format 을 쓰지 않는다. 오른쪽 프롬프트는 zsh 가 계산한 폭과
#      터미널이 그린 폭이 어긋나면 줄바꿈이 깨진다. 실제로 그 버그를 겪었다
#      (gcloud 의 구름 기호 U+2601 + U+FE0F 를 zsh 는 1칸, Ghostty 는 2칸으로 셈).
#   4. 폭이 1칸으로 확정된 문자만 쓴다. 이모지와 variation selector 금지.

add_newline = false
continuation_prompt = "[❯❯](dimmed white) "

format = """
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$character"""

# ── 1줄: 맥락 ──────────────────────────────────────────────────────────

# SSH 로 들어왔을 때만 서버 이름. IP 와 사용자명은 뺐다 — 서버 구분에는
# 호스트명 하나면 충분하다.
[hostname]
ssh_only = true
trim_at = "."
format = "[$hostname]($style) "
style = "bold green"

# truncate_to_repo: 저장소 안에서는 저장소 루트 기준으로 보여준다.
# ~/projects/cosmos/src/api 대신 cosmos/src/api.
#
# truncation_length = 0 은 "자르지 않는다"는 뜻이다. 3 으로 두면 뒤에서 세 칸만
# 남겨서 정작 중요한 저장소 이름이 날아간다 (…/nvim/lua/plugins). 2줄 구성이라
# 1줄이 길어져도 입력 공간을 안 먹으므로 자를 이유가 없다.
#
# truncation_symbol 도 비웠다. 안 자르는데 "…/" 만 붙어서 저장소 루트가
# "…/dotfiles" 로 보였다.
[directory]
truncate_to_repo = true
truncation_length = 0
truncation_symbol = ""
home_symbol = "~"
read_only = " ro"
read_only_style = "red"
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold blue"

# symbol 을 비웠다 — 기본값은 nerd font 글리프라 폰트 없는 환경에서 깨진다.
# 경로(파랑)와는 색으로 구분된다.
[git_branch]
symbol = ""
format = "[$branch]($style) "
style = "purple"

# rebase/merge/cherry-pick 진행 중에만 뜬다. 평소에는 폭 0.
[git_state]
format = "[$state($progress_current/$progress_total)]($style) "
style = "bold red"

# 기호는 starship 기본값을 쓴다: +staged !modified ?untracked ✘deleted
# »renamed $stashed =conflicted ⇡ahead ⇣behind. 전부 폭 1칸으로 확인했다.
[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"

# 5초 넘게 걸린 명령에만 소요 시간을 붙인다.
[cmd_duration]
min_time = 5000
format = "[$duration]($style) "
style = "dimmed yellow"

# ── 2줄: 입력 ──────────────────────────────────────────────────────────

# EDITOR 가 nvim 이라 zsh 가 vi 키바인딩을 쓴다 → 노멀 모드에서 ❮ 로 바뀐다.
# 직전 명령이 실패하면 ❯ 가 빨강.
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold cyan)"
